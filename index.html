<style>
html{-webkit-text-size-adjust:100%}body{margin:0}[hidden]{display:none!important}
/* Раскладка: узкая колонка тренажёра; карточка задания как единственный крупный объект, остальное тихое.
   Цвет: холодный серо-синий нейтрал + кобальт. Шрифты: Literata для португальских форм, IBM Plex Sans для интерфейса. */
:root {
  --bg: #f3f4f7;
  --surface: #ffffff;
  --surface-2: #eceef3;
  --ink: #151922;
  --muted: #5a6372;
  --line: #d8dce4;
  --accent: #1f45b7;
  --accent-ink: #ffffff;
  --accent-soft: #e4eafb;
  --good: #146c43;
  --good-bg: #e2f3ea;
  --bad: #b3261e;
  --bad-bg: #fbe8e6;
  --warn: #7a5200;
  --warn-bg: #fff1d3;
  --display: 'Literata', Georgia, 'Times New Roman', serif;
  --ui: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1117;
    --surface: #161b23;
    --surface-2: #1f2530;
    --ink: #e8ebf1;
    --muted: #98a2b3;
    --line: #2a313d;
    --accent: #8ea8ff;
    --accent-ink: #0d1117;
    --accent-soft: #1c2542;
    --good: #5cd39b;
    --good-bg: #12301f;
    --bad: #ff8a80;
    --bad-bg: #3a1815;
    --warn: #f2c26b;
    --warn-bg: #33270a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1117;
  --surface: #161b23;
  --surface-2: #1f2530;
  --ink: #e8ebf1;
  --muted: #98a2b3;
  --line: #2a313d;
  --accent: #8ea8ff;
  --accent-ink: #0d1117;
  --accent-soft: #1c2542;
  --good: #5cd39b;
  --good-bg: #12301f;
  --bad: #ff8a80;
  --bad-bg: #3a1815;
  --warn: #f2c26b;
  --warn-bg: #33270a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--ui);
  font-size: 15px;
  line-height: 1.5;
  padding-block: 12px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--display); font-weight: 600; font-size: 22px; letter-spacing: -0.01em; }
.brand small { font-family: var(--ui); font-weight: 500; font-size: 12px; color: var(--muted); margin-left: 8px; letter-spacing: 0.04em; text-transform: uppercase; }
.streak { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

.tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 10px; overflow-x: auto; }
.tab { flex: 1 0 auto; border: 0; background: transparent; padding: 8px 12px; border-radius: 7px; font-weight: 500; color: var(--muted); white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.settings { padding: 0; }
.settings > summary { list-style: none; cursor: pointer; padding: 11px 14px; display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--muted); }
.settings > summary::-webkit-details-marker { display: none; }
.settings > summary b { color: var(--ink); font-weight: 600; }
.settings[open] > summary { border-bottom: 1px solid var(--line); }
.settings-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 14px; }
.set-label { font-size: 12px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip.ghost { color: var(--muted); border-style: dashed; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.check { display: inline-flex; gap: 8px; align-items: center; font-size: 14px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.03em; padding: 3px 9px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); }
.tag.plain { background: var(--surface-2); color: var(--muted); font-weight: 500; }
.tag.irr { background: var(--warn-bg); color: var(--warn); }
.who { font-family: var(--display); font-size: 20px; font-weight: 600; }
.prompt { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.verb { font-family: var(--display); font-size: clamp(30px, 8vw, 42px); font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; overflow-wrap: anywhere; }
.gloss { color: var(--muted); font-size: 14px; }
.answer { display: flex; gap: 8px; }
.inp { flex: 1; min-width: 0; font-family: var(--display); font-size: 20px; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); }
.inp:focus { border-color: var(--accent); outline: none; }
.inp.ok { border-color: var(--good); background: var(--good-bg); }
.inp.bad { border-color: var(--bad); background: var(--bad-bg); }
.inp.near { border-color: var(--warn); background: var(--warn-bg); }
.btn { border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 600; background: var(--accent); color: var(--accent-ink); }
.btn.sec { background: var(--surface-2); color: var(--ink); }
.btn.sm { padding: 6px 12px; font-size: 13px; border-radius: 8px; }
.btn[disabled] { opacity: .5; cursor: default; }
.keys { display: flex; flex-wrap: wrap; gap: 5px; }
.key { min-width: 34px; height: 32px; border: 1px solid var(--line); background: var(--surface); border-radius: 7px; font-family: var(--display); font-size: 16px; }
.key:active { background: var(--accent-soft); }

.fb { border-radius: 10px; padding: 12px 14px; font-size: 14px; display: flex; flex-direction: column; gap: 6px; }
.fb.ok { background: var(--good-bg); color: var(--good); }
.fb.bad { background: var(--bad-bg); color: var(--bad); }
.fb.near { background: var(--warn-bg); color: var(--warn); }
.fb .big { font-family: var(--display); font-size: 22px; font-weight: 600; color: var(--ink); }
.fb .why { color: var(--ink); opacity: .85; }
.paradigm { width: 100%; border-collapse: collapse; font-size: 14px; }
.paradigm td { padding: 5px 8px; border-top: 1px solid var(--line); }
.paradigm td:first-child { color: var(--muted); width: 38%; }
.paradigm td:last-child { font-family: var(--display); font-size: 16px; }
.paradigm tr.hit td { background: var(--accent-soft); font-weight: 600; }
.scroll { overflow-x: auto; }

.table-rows { display: flex; flex-direction: column; gap: 8px; }
.trow { display: grid; grid-template-columns: minmax(78px, 30%) 1fr; gap: 10px; align-items: center; }
.trow label { color: var(--muted); font-size: 14px; }
.trow .inp { font-size: 18px; padding: 8px 10px; }
.trow .fix { grid-column: 2; font-family: var(--display); color: var(--good); font-size: 16px; margin-top: -4px; }

.cloze { font-family: var(--display); font-size: clamp(19px, 4.6vw, 24px); line-height: 1.7; }
.cloze .inp { display: inline-block; width: auto; max-width: 100%; font-size: inherit; padding: 2px 8px; margin: 0 2px; vertical-align: baseline; }
.hint { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

.flip { text-align: center; padding: 30px 12px; }
.flip .term { font-family: var(--display); font-size: clamp(26px, 7vw, 36px); font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; }
.flip .back { margin-top: 14px; font-size: 20px; color: var(--accent); }
.flip .note { margin-top: 8px; font-size: 12px; color: var(--muted); }
.options { display: grid; gap: 8px; }
.opt { text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 14px; }
.opt.ok { border-color: var(--good); background: var(--good-bg); }
.opt.bad { border-color: var(--bad); background: var(--bad-bg); }
.icon-btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
.icon-btn svg { width: 16px; height: 16px; fill: currentColor; }

.diff .w { padding: 0 3px; border-radius: 4px; }
.diff .miss { background: var(--bad-bg); color: var(--bad); }
.diff .extra { text-decoration: line-through; color: var(--muted); }
textarea.inp { width: 100%; min-height: 84px; resize: vertical; font-size: 18px; }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.tile { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.tile b { display: block; font-family: var(--display); font-size: 24px; font-variant-numeric: tabular-nums; }
.tile span { font-size: 12px; color: var(--muted); }
.bars { display: flex; flex-direction: column; gap: 9px; }
.bar { display: grid; grid-template-columns: minmax(110px, 38%) 1fr 52px; gap: 10px; align-items: center; font-size: 13px; }
.bar .track { height: 10px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
.bar .fill { height: 100%; background: var(--accent); }
.bar .pct { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.list { display: flex; flex-direction: column; }
.li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; flex-wrap: wrap; }
.li:first-child { border-top: 0; }
.li .f { font-family: var(--display); font-weight: 600; }
h2 { font-size: 15px; margin: 0 0 10px; }
.muted { color: var(--muted); font-size: 13px; }
.empty { color: var(--muted); padding: 8px 0; }
.foot { color: var(--muted); font-size: 12px; text-align: center; }
@media (max-width: 480px) {
  .card { padding: 16px; }
  .bar { grid-template-columns: minmax(96px, 40%) 1fr 44px; }
}
@media (prefers-reduced-motion: no-preference) {
  .inp, .chip, .opt { transition: border-color .12s, background-color .12s; }
}

.tr { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 2px; font-size: 16px; }

.sel { font-family: var(--ui); font-size: 14px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); max-width: 100%; min-width: 0; }
.modes { margin-bottom: -4px; }

</style>
</head>
<body>
<div class="wrap">
<header class="top"><div class="brand">Conjugar<small>B1.2 · pt-PT</small></div><div class="streak" id="streak"></div></header>
<nav class="tabs" id="tabs" role="tablist" aria-label="Разделы"></nav>
<main id="view"></main>
<p class="foot">Времена, предложения и слова взяты с досок Miro (B1.1 и B1.2). Переводы глаголов и слов с пометкой «перевод мой» добавлены не с досок.</p>
</div>
<script>
/* Движок спряжений европейского португальского (pt-PT).
   Лица: eu, tu, ele/ela/você, nós, eles/elas/vocês (vós не используется). */
(function (root) {
  'use strict';

  var PERSONS = ['eu', 'tu', 'ele/ela/você', 'nós', 'eles/elas/vocês'];
  var VOWELS = 'aeiou';

  // ---------- таблицы неправильных глаголов ----------
  // pres, pps, imp: массивы из 5 форм. part, ger, fut (основа для Futuro/Condicional),
  // conj: Presente do Conjuntivo, когда форма eu не оканчивается на -o.
  var IRR = {
    ser:   { pres: ['sou', 'és', 'é', 'somos', 'são'],
             pps: ['fui', 'foste', 'foi', 'fomos', 'foram'],
             imp: ['era', 'eras', 'era', 'éramos', 'eram'],
             part: 'sido', conj: ['seja', 'sejas', 'seja', 'sejamos', 'sejam'], imper: 'sê' },
    estar: { pres: ['estou', 'estás', 'está', 'estamos', 'estão'],
             pps: ['estive', 'estiveste', 'esteve', 'estivemos', 'estiveram'],
             conj: ['esteja', 'estejas', 'esteja', 'estejamos', 'estejam'], strong: true },
    ter:   { pres: ['tenho', 'tens', 'tem', 'temos', 'têm'],
             pps: ['tive', 'tiveste', 'teve', 'tivemos', 'tiveram'],
             imp: ['tinha', 'tinhas', 'tinha', 'tínhamos', 'tinham'],
             part: 'tido', strong: true },
    ir:    { pres: ['vou', 'vais', 'vai', 'vamos', 'vão'],
             pps: ['fui', 'foste', 'foi', 'fomos', 'foram'],
             part: 'ido', conj: ['vá', 'vás', 'vá', 'vamos', 'vão'] },
    vir:   { pres: ['venho', 'vens', 'vem', 'vimos', 'vêm'],
             pps: ['vim', 'vieste', 'veio', 'viemos', 'vieram'],
             imp: ['vinha', 'vinhas', 'vinha', 'vínhamos', 'vinham'],
             part: 'vindo', strong: true },
    ver:   { pres: ['vejo', 'vês', 'vê', 'vemos', 'veem'],
             pps: ['vi', 'viste', 'viu', 'vimos', 'viram'],
             part: 'visto' },
    ler:   { pres: ['leio', 'lês', 'lê', 'lemos', 'leem'],
             pps: ['li', 'leste', 'leu', 'lemos', 'leram'] },
    crer:  { pres: ['creio', 'crês', 'crê', 'cremos', 'creem'],
             pps: ['cri', 'creste', 'creu', 'cremos', 'creram'] },
    dar:   { pres: ['dou', 'dás', 'dá', 'damos', 'dão'],
             pps: ['dei', 'deste', 'deu', 'demos', 'deram'],
             conj: ['dê', 'dês', 'dê', 'demos', 'deem'], strong: true },
    fazer: { pres: ['faço', 'fazes', 'faz', 'fazemos', 'fazem'],
             pps: ['fiz', 'fizeste', 'fez', 'fizemos', 'fizeram'],
             part: 'feito', fut: 'far', strong: true },
    dizer: { pres: ['digo', 'dizes', 'diz', 'dizemos', 'dizem'],
             pps: ['disse', 'disseste', 'disse', 'dissemos', 'disseram'],
             part: 'dito', fut: 'dir', strong: true },
    trazer:{ pres: ['trago', 'trazes', 'traz', 'trazemos', 'trazem'],
             pps: ['trouxe', 'trouxeste', 'trouxe', 'trouxemos', 'trouxeram'],
             fut: 'trar', strong: true },
    poder: { pres: ['posso', 'podes', 'pode', 'podemos', 'podem'],
             pps: ['pude', 'pudeste', 'pôde', 'pudemos', 'puderam'], strong: true },
    querer:{ pres: ['quero', 'queres', 'quer', 'queremos', 'querem'],
             pps: ['quis', 'quiseste', 'quis', 'quisemos', 'quiseram'],
             conj: ['queira', 'queiras', 'queira', 'queiramos', 'queiram'], strong: true },
    saber: { pres: ['sei', 'sabes', 'sabe', 'sabemos', 'sabem'],
             pps: ['soube', 'soubeste', 'soube', 'soubemos', 'souberam'],
             conj: ['saiba', 'saibas', 'saiba', 'saibamos', 'saibam'], strong: true },
    'pôr': { pres: ['ponho', 'pões', 'põe', 'pomos', 'põem'],
             pps: ['pus', 'puseste', 'pôs', 'pusemos', 'puseram'],
             imp: ['punha', 'punhas', 'punha', 'púnhamos', 'punham'],
             part: 'posto', ger: 'pondo', fut: 'por', strong: true },
    haver: { pres: ['hei', 'hás', 'há', 'havemos', 'hão'],
             pps: ['houve', 'houveste', 'houve', 'houvemos', 'houveram'],
             conj: ['haja', 'hajas', 'haja', 'hajamos', 'hajam'], strong: true },
    caber: { pres: ['caibo', 'cabes', 'cabe', 'cabemos', 'cabem'],
             pps: ['coube', 'coubeste', 'coube', 'coubemos', 'couberam'], strong: true },
    valer: { pres: ['valho', 'vales', 'vale', 'valemos', 'valem'] },
    rir:   { pres: ['rio', 'ris', 'ri', 'rimos', 'riem'],
             pps: ['ri', 'riste', 'riu', 'rimos', 'riram'] },
    ouvir: { pres: ['ouço', 'ouves', 'ouve', 'ouvimos', 'ouvem'] },
    pedir: { pres: ['peço', 'pedes', 'pede', 'pedimos', 'pedem'] },
    medir: { pres: ['meço', 'medes', 'mede', 'medimos', 'medem'] },
    dormir:{ pres: ['durmo', 'dormes', 'dorme', 'dormimos', 'dormem'] },
    vestir:{ pres: ['visto', 'vestes', 'veste', 'vestimos', 'vestem'] },
    seguir:{ pres: ['sigo', 'segues', 'segue', 'seguimos', 'seguem'] },
    sentir:{ pres: ['sinto', 'sentes', 'sente', 'sentimos', 'sentem'] },
    mentir:{ pres: ['minto', 'mentes', 'mente', 'mentimos', 'mentem'] },
    servir:{ pres: ['sirvo', 'serves', 'serve', 'servimos', 'servem'] },
    repetir:{ pres: ['repito', 'repetes', 'repete', 'repetimos', 'repetem'] },
    preferir:{ pres: ['prefiro', 'preferes', 'prefere', 'preferimos', 'preferem'] },
    sugerir:{ pres: ['sugiro', 'sugeres', 'sugere', 'sugerimos', 'sugerem'] },
    divertir:{ pres: ['divirto', 'divertes', 'diverte', 'divertimos', 'divertem'] },
    competir:{ pres: ['compito', 'competes', 'compete', 'competimos', 'competem'] },
    cobrir:{ pres: ['cubro', 'cobres', 'cobre', 'cobrimos', 'cobrem'], part: 'coberto' },
    descobrir:{ pres: ['descubro', 'descobres', 'descobre', 'descobrimos', 'descobrem'], part: 'descoberto' },
    abrir: { part: 'aberto' },
    escrever:{ part: 'escrito' },
    subir: { pres: ['subo', 'sobes', 'sobe', 'subimos', 'sobem'] },
    fugir: { pres: ['fujo', 'foges', 'foge', 'fugimos', 'fogem'] },
    sair:  { pres: ['saio', 'sais', 'sai', 'saímos', 'saem'] },
    cair:  { pres: ['caio', 'cais', 'cai', 'caímos', 'caem'] },
    trair: { pres: ['traio', 'trais', 'trai', 'traímos', 'traem'] },
    descrever:{ part: 'descrito' },
    construir:{ pres: ['construo', 'constróis', 'constrói', 'construímos', 'constroem'] },
    destruir: { pres: ['destruo', 'destróis', 'destrói', 'destruímos', 'destroem'] },
    pagar: { part: 'pago' },
    gastar:{ part: 'gasto' },
    ganhar:{ part: 'ganho' }
  };

  // Глаголы с двойным причастием: [для ter, для ser/estar]
  var DOUBLE_PART = {
    aceitar: ['aceitado', 'aceite'], entregar: ['entregado', 'entregue'],
    matar: ['matado', 'morto'], salvar: ['salvado', 'salvo'],
    prender: ['prendido', 'preso'], eleger: ['elegido', 'eleito'],
    expulsar: ['expulsado', 'expulso'], imprimir: ['imprimido', 'impresso'],
    limpar: ['limpado', 'limpo'], acender: ['acendido', 'aceso'],
    envolver: ['envolvido', 'envolto'], suspender: ['suspendido', 'suspenso'],
    morrer: ['morrido', 'morto']
  };

  // Производные глаголы: префикс + база. Формы базы получают префикс.
  var COMPOUNDS = {};
  [['ter', ['man', 'con', 'ob', 're', 'de', 'ater', 'abs', 'entre', 'sus']],
   ['vir', ['con', 'inter', 'pro', 'sobre', 'ad']],
   ['pôr', ['com', 're', 'pro', 'su', 'dis', 'ex', 'im', 'op', 'de', 'ante', 'sobre']],
   ['ver', ['pre', 're', 'ante']],
   ['fazer', ['des', 're', 'satis', 'contra']],
   ['dizer', ['contra', 'des', 'pre']],
   ['ler', ['re']],
   ['seguir', ['con', 'per']],
   ['trair', ['a', 'dis', 'con', 'sub', 'abs', 're']]].forEach(function (pair) {
    var base = pair[0];
    pair[1].forEach(function (pre) {
      var baseStem = base === 'pôr' ? 'por' : base;
      COMPOUNDS[pre + baseStem] = { base: base, prefix: pre };

    var it = store.srs[key] || { box: 0, due: 0, ok: 0, bad: 0 };
    if (ok) { it.ok++; it.box = Math.min(4, it.box + 1); } else { it.bad++; it.box = 0; }
    it.due = now + BOX_DAYS[it.box] * DAY;
    if (label) it.lab = label;
    store.srs[key] = it;
    if (group === 'words') store.words[ok ? 'ok' : 'bad']++;
    else if (group === 'listen') store.listen[ok ? 'ok' : 'bad']++;
    else {
      var t = store.tense[group] || { ok: 0, bad: 0 };
      t[ok ? 'ok' : 'bad']++;
      store.tense[group] = t;
    }
    var td = today();
    if (store.days.indexOf(td) < 0) { store.days.push(td); if (store.days.length > 800) store.days.shift(); }
    save();
  }
  function setPref(k, v) { SET[k] = v; save(); }

  // ---------- утилиты ----------
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function norm(s) { return String(s).trim().toLowerCase().replace(/\s+/g, ' '); }
  function strip(s) { return norm(s).normalize('NFD').replace(/[̀-ͯ]/g, ''); }
  function rnd(n) { return Math.floor(Math.random() * n); }
  function pickOne(a) { return a[rnd(a.length)]; }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = rnd(i + 1), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  // оценка: сравнение ответа с эталоном. 'ok' | 'near' (верно кроме диакритики) | 'bad'
  function judge(user, target, strict) {
    var n = norm(user);
    if (!n) return { v: 'empty' };
    var t = norm(target);
    var cands = [t];
    if (t.indexOf('não ') === 0) cands.push(t.slice(4));
    for (var i = 0; i < cands.length; i++) if (n === cands[i]) return { v: 'ok' };
    var sn = strip(n);
    for (var j = 0; j < cands.length; j++) {
      if (sn === strip(cands[j])) return strict ? { v: 'near' } : { v: 'ok', accent: true };
    }
    return { v: 'bad' };
  }

  // выбор элемента: просроченные и новые важнее, свежевыученные реже
  function score(key) {
    var it = store.srs[key];
    if (!it) return 1 + Math.random() * 0.5;
    if (it.due <= Date.now()) return 2 + (4 - it.box) * 0.4 + Math.random() * 0.5;
    return 0.1 + Math.random() * 0.3;
  }
  function chooseBest(makeCand, tries) {
    var best = null, bs = -1;
    for (var i = 0; i < tries; i++) {
      var c = makeCand();
      var s = score(c.key);
      if (s > bs) { bs = s; best = c; }
    }
    return best;
  }

  var tenseName = function (id) { return E.TENSES[id] ? E.TENSES[id].name : id; };

  // ---------- голос ----------
  var ptVoice = null, voiceChecked = false, ptVoices = [];
  function findVoice() {
    if (!('speechSynthesis' in window)) return null;
    var vs = [];
    try { vs = window.speechSynthesis.getVoices() || []; } catch (e) {}
    var pts = vs.filter(function (x) { return /^pt/i.test(x.lang); });
    ptVoices = pts.sort(function (a, b) { return voiceScore(b) - voiceScore(a); });
    var chosen = null;
    if (SET && SET.voice) ptVoices.forEach(function (x) { if (!chosen && (x.voiceURI === SET.voice || x.name === SET.voice)) chosen = x; });
    return chosen || ptVoices[0] || null;
  }
  function voiceScore(v) {
    var n = v.name || '', sc = 0;
    if (/^pt[-_]PT/i.test(v.lang)) sc += 100; else sc += 30;
    if (/natural|online/i.test(n)) sc += 40;
    if (/premium|enhanced|neural|siri/i.test(n)) sc += 25;
    if (/google/i.test(n)) sc += 5;
    if (v.localService === false) sc += 5;
    return sc;
  }
  function voiceRowHtml() {
    if (!('speechSynthesis' in window)) return '';
    if (!ptVoices.length) return '<div><div class="set-label">Голос</div><div class="muted">Португальских голосов в этом браузере нет.</div></div>';
    var opts = ptVoices.map(function (v) {
      return '<option value="' + esc(v.voiceURI || v.name) + '"' + (ptVoice && v.name === ptVoice.name ? ' selected' : '') + '>' + esc(v.name + ' (' + v.lang + ')') + '</option>';
    }).join('');

  // ---------- состояние вкладок ----------

      var p = pickOne(idx);

  // ---------- слова ----------
  var WORDS = D.WORDS.map(function (w) { return { pt: w[0], ru: w[1], topic: w[2], own: !!w[3] }; })
    .concat(VERBS.map(function (v) { return { pt: v.inf, ru: v.ru, topic: 'Инфинитивы', own: true }; }));
  function wordTopics() {
    var seen = {}, out = [];
    WORDS.forEach(function (w) { if (!seen[w.topic]) { seen[w.topic] = 1; out.push(w.topic); } });
    return out;
  }
  function wordPool() { return WORDS.filter(function (w) { return SET.wTopic === 'all' || w.topic === SET.wTopic; }); }
  function newWord() {
    var p = wordPool();
    if (!p.length) { W = { none: true }; return; }
    var c = chooseBest(function () { var w = pickOne(p); return { key: 'w|' + w.pt, w: w }; }, 12);
    var w = c.w, opts = null;
    if (SET.wMode === 'quiz') {

  function dayWord(n) { var m = n % 10, h = n % 100; if (m === 1 && h !== 11) return 'день'; if (m >= 2 && m <= 4 && (h < 12 || h > 14)) return 'дня'; return 'дней'; }
  function focusNext() {
    var b = document.querySelector('[data-next]');
    if (b) { try { b.focus({ preventScroll: true }); } catch (e) {} }
  }

  // ---------- события ----------
  document.addEventListener('focusin', function (e) {
    var t = e.target;
    if (t && (t.tagName === 'INPUT' && t.type === 'text' || t.tagName === 'INPUT' && !t.type || t.tagName === 'TEXTAREA')) lastInput = t;
  });
  document.addEventListener('mousedown', function (e) {
    if (e.target.closest && e.target.closest('.key')) e.preventDefault();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    var t = e.target;
    if (t.tagName === 'TEXTAREA') { if (e.shiftKey) return; e.preventDefault(); checkListen(); return; }
    var act = t.getAttribute && t.getAttribute('data-enter');
    if (act) { e.preventDefault(); doAct(act, t); return; }
    if (t.classList && t.classList.contains('tin')) {
      e.preventDefault();
      var ins = Array.prototype.slice.call(document.querySelectorAll('.tin')), i = ins.indexOf(t);
      if (i < ins.length - 1) ins[i + 1].focus(); else checkTable();
    }
  });
  document.addEventListener('change', function (e) {
    var t = e.target, act = t.getAttribute && t.getAttribute('data-act');
    if (act === 'strict') { setPref('strict', t.checked); }
    if (act === 'slow') { setPref('lSlow', t.checked); }
    if (act === 'voice') { setPref('voice', t.value); refreshVoice(); speak('Bom dia! Vamos praticar português.', false); render(); }
  });
  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el || el.tagName === 'INPUT') return;
    doAct(el.getAttribute('data-act'), el);
  });

  function togglePreset(v) {
    if (v === 'conj') SET.tenses = ['cpres', 'cimp', 'cfut', 'cppc', 'cmqpc'];
    else if (v === 'past') SET.tenses = ['pps', 'imp', 'ppc', 'mqpc'];
    else SET.tenses = Object.keys(E.TENSES);
    save();
  }

  function doAct(act, el) {
    var v = el.getAttribute('data-v');
    switch (act) {
      case 'tab': TAB = v; resetAsk = false; render(); break;
      case 'ch':
        if (lastInput && !lastInput.disabled && document.body.contains(lastInput)) {
          var c = el.getAttribute('data-c'), s = lastInput.selectionStart, e2 = lastInput.selectionEnd, val = lastInput.value;
          if (s == null) { s = e2 = val.length; }
          lastInput.value = val.slice(0, s) + c + val.slice(e2);
          lastInput.focus();
          try { lastInput.setSelectionRange(s + 1, s + 1); } catch (er) {}
        } else {
          var a = document.getElementById('ans') || document.querySelector('.tin');
          if (a && !a.disabled) { a.value += el.getAttribute('data-c'); a.focus(); }
        }
        break;
      case 'tense':
        var i = SET.tenses.indexOf(v);
        if (i >= 0) { if (SET.tenses.length > 1) SET.tenses.splice(i, 1); } else SET.tenses.push(v);
        save(); C = null; render(); break;
      case 'preset': togglePreset(v); C = null; render(); break;
      case 'vf': setPref('vf', v); C = null; render(); break;
      case 'cmode': setPref('mode', v); C = null; render(); break;
      case 'check-one': checkOne(); break;
      case 'check-table': checkTable(); break;
      case 'next': case 'skip': newConj(); render(); break;
      case 'sboard': setPref('sBoard', v); SN = null; render(); break;
      case 'stense': setPref('sTense', v); SN = null; render(); break;
      case 'hint': setPref('sHint', !SET.sHint); render(); break;
      case 'check-sent': checkSent(); break;
      case 'next-sent': newSent(); render(); break;
      case 'wmode': setPref('wMode', v); W = null; render(); break;
      case 'wdir': setPref('wDir', v); W = null; render(); break;
      case 'wtopic': setPref('wTopic', v); W = null; render(); break;
      case 'check-word': checkWord(); break;
      case 'accept-mine': acceptMine(); break;
      case 'show': W.shown = true; render(); focusNext(); break;
      case 'know':
        record('w|' + W.w.pt, 'words', v === '1', W.w.pt + ' · ' + W.w.ru);
        newWord(); render(); break;
      case 'pick':
        if (W.picked != null) break;
        W.picked = +el.getAttribute('data-i');
        record('w|' + W.w.pt, 'words', W.opts[W.picked].pt === W.w.pt, W.w.pt + ' · ' + W.w.ru);
        render(); focusNext(); break;
      case 'next-word': wseq++; newWord(); render(); break;
      case 'voice-test': speak('Bom dia! Hoje vamos praticar o conjuntivo e o infinitivo pessoal.', false); break;
      case 'say': speak(el.getAttribute('data-t'), false); break;
      case 'lmode': setPref('lMode', v); L = null; render(); break;
      case 'play': speak(L.item.text, SET.lSlow); break;
      case 'reveal': L.reveal = !L.reveal; var keep = document.getElementById('ans'); var kv = keep ? keep.value : ''; render(); var k2 = document.getElementById('ans'); if (k2 && !L.done) k2.value = kv; break;
      case 'check-listen': checkListen(); break;
      case 'next-listen': newListen(); render(); break;
      case 'reset': resetAsk = true; render(); break;
      case 'reset-no': resetAsk = false; render(); break;
      case 'reset-yes':
        store.srs = {}; store.tense = {}; store.words = { ok: 0, bad: 0 }; store.listen = { ok: 0, bad: 0 }; store.days = [];
        save(); resetAsk = false; render(); break;
    }
  }

  render();
})();

</script>
